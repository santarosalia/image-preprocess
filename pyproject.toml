[project]
name = "image-preprocess"
version = "0.1.0"
description = "영수증/문서 이미지 OpenCV 고전 전처리와 선택적 영역 검출"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
]

[tool.uv]
package = false
